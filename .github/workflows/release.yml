name: Release Last Build

on:
  workflow_dispatch: # Manual trigger only
    inputs:
      tag_name:
        description: 'Release Tag (leave empty to use version from src/version.h)'
        required: false
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            VERSION="${{ github.event.inputs.tag_name }}"
          else
            MAJOR=$(grep 'RELEASE_VER_MAIN' src/version.h | awk '{print $3}')
            MINOR=$(grep 'RELEASE_VER_SUB' src/version.h | awk '{print $3}')
            FIX=$(grep 'RELEASE_VER_FIX' src/version.h | awk '{print $3}')
            VERSION="v${MAJOR}.${MINOR}.${FIX}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Release version: $VERSION"

      - name: Download Artifact from Latest Build Run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh run list --workflow="build.yml" --status=success --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -z "$RUN_ID" ]; then
            echo "Error: No successful build runs found for build.yml!" >&2
            exit 1
          fi
          echo "Downloading artifact from build run ID: $RUN_ID"
          gh run download "$RUN_ID" --name version-x64 --dir ./raw_artifact

      - name: Flatten and Package Single Release Zip
        run: |
          # Create a flat staging directory
          mkdir -p ./release_pkg

          # Ensure we only copy the raw binary and ini (no inner zips or paths)
          find ./raw_artifact -type f -name "version.dll" -exec cp {} ./release_pkg/ \;
          find ./raw_artifact -type f -name "chrome++.ini" -exec cp {} ./release_pkg/ \;

          # Create a single clean zip containing only version.dll and chrome++.ini
          cd ./release_pkg
          zip -9 "../ChromePlus-${{ env.VERSION }}-x64.zip" version.dll chrome++.ini
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ChromePlus-${{ env.VERSION }}-x64.zip
            release_pkg/version.dll
            release_pkg/chrome++.ini
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
