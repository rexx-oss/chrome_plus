name: Build Portable version.dll

on:
  workflow_dispatch:  # Allows manual 1-click trigger from GitHub Actions tab
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake (Native MSVC, No VC-LTL)
        run: |
          cmake -B build -A x64 -DCMAKE_BUILD_TYPE=MinSizeRel -DCHROME_PLUS_USE_VC_LTL=OFF

      - name: Compile version.dll
        run: |
          cmake --build build --config MinSizeRel --parallel

      - name: Upload Built version.dll
        uses: actions/upload-artifact@v4
        with:
          name: version-x64
          path: build/**/version.dll
