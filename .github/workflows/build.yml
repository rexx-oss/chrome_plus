name: Build Portable version.dll

on:
  workflow_dispatch: # Manual trigger only

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: |
          cmake -B build -A x64 -DCMAKE_BUILD_TYPE=MinSizeRel -DCHROME_PLUS_USE_VC_LTL=OFF

      - name: Compile version.dll
        run: |
          cmake --build build --config MinSizeRel --parallel

      - name: Stage Raw Files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $dll = (Get-ChildItem -Path build -Filter "version.dll" -Recurse | Select-Object -First 1).FullName
          Copy-Item $dll -Destination dist\version.dll
          Copy-Item src\chrome++.ini -Destination dist\chrome++.ini

      # Uploads only the raw files (no zip created here)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: version-x64
          path: |
            dist/version.dll
            dist/chrome++.ini
