; ==============================================================================
; Chrome++ Portable (version.dll) Configuration
; Minimal configuration for DPAPI bypass and cookie persistence
; ==============================================================================

[general]
; Portable profile and cache directories (relative to brave.exe)
data_dir=%app%\..\data
cache_dir=%app%\..\data\Cache

; Additional Chromium command line arguments (optional)
command_line=

; Commands to run on browser launch / exit (optional)
launch_on_startup=
launch_on_exit=

; Allow viewing saved passwords in settings without Windows login password
show_password=1

; Ignore enterprise/domain policies from the host Windows registry
ignore_policies=1

; Suppress false "browser out of date / relaunch" prompts
suppress_false_upgrade_notification=1

; Win32k system call fallback (keep 0 unless startup crashes occur)
win32k=0
